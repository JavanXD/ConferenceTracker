# Lightweight checks for the static dashboard and catalog.
# Skipped when only docs/marketing files change (see paths filter).

name: CI

on:
  pull_request:
    paths:
      - "data/**"
      - "assets/**"
      - "app.js"
      - "index.html"
      - "impressum.html"
      - "privacy.html"
      - "styles.css"
      - "ASSET_VERSION"
      - "scripts/stamp_asset_version.py"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/**"
      - "app.js"
      - "index.html"
      - "impressum.html"
      - "privacy.html"
      - "styles.css"
      - "ASSET_VERSION"
      - "scripts/stamp_asset_version.py"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate conferences.csv
        run: python scripts/validate_catalog.py

  stamp-assets:
    runs-on: ubuntu-latest
    needs: validate-catalog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Stamp static asset cache versions
        run: python scripts/stamp_asset_version.py

      - name: Commit asset version stamp
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: stamp static asset cache version"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
